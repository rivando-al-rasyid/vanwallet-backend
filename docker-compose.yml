services:
  app:
    build: .
    container_name: vanwallet_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      RDB_ADDR: redis:6379
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:                          
        condition: service_completed_successfully
    networks:
      - vanwallet_net

  # ----------------------------------------------
  # NEW: Auto-run database migrations once
  # ----------------------------------------------
  migrate:
    image: migrate/migrate
    container_name: vanwallet_migrate
    env_file:
      - .env                           # reads DB_USER, DB_PASS, DB_NAME
    volumes:
      - ./database/migrations:/migrations   # bind your local migration files
    command: [
      "-database",
      "postgresql://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}?sslmode=disable",
      "-path", "/migrations",
      "up"
    ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vanwallet_net

  postgres:
    image: postgres:17-alpine
    container_name: vanwallet_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vanwallet_net

  redis:
    image: redis:alpine
    container_name: vanwallet_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vanwallet_net

volumes:
  postgres_data:
  redis_data:

networks:
  vanwallet_net: