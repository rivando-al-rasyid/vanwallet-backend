services:
  frontend:
    image: ghcr.io/rivando-al-rasyid/vanwallet-react:latest 
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vanwallet-network

  backend:
    image: ghcr.io/rivando-al-rasyid/vanwallet-backend:latest 
    container_name: vanwallet_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vanwallet-network

  postgres:
    image: postgres:17-alpine
    container_name: vanwallet_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - vanwallet-network

  migration:
    image: migrate/migrate:v4.18.3
    container_name: vanwallet_migration
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]
    networks:
      - vanwallet-network

  redis:
    image: redis:7-alpine
    container_name: vanwallet_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - vanwallet-network

volumes:
  postgres_data:

networks:
  vanwallet-network:
    driver: bridge