services:
  frontend:
    image: ghcr.io/rivando-al-rasyid/vanwallet-react:latest
    container_name: vanwallet_frontend
    restart: unless-stopped
    ports:
      - "80:80" # This is the ONLY entry point from the host machine
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanwallet_network

  backend:
    image: ghcr.io/rivando-al-rasyid/vanwallet-backend:latest
    container_name: vanwallet_backend
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - vanwallet_network

  postgres:
    image: postgres:17-alpine
    container_name: vanwallet_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - vanwallet_network

  migration:
    image: migrate/migrate:v4.18.3
    container_name: vanwallet_migration
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}?sslmode=disable",
        "up"
      ]
    networks:
      - vanwallet_network

  redis:
    image: redis:7-alpine
    container_name: vanwallet_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - vanwallet_network

volumes:
  postgres_data:

networks:
  vanwallet_network:
    driver: bridge
