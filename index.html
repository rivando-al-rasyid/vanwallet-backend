<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Test Utility</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }
      button {
        padding: 10px 15px;
        margin-right: 10px;
        cursor: pointer;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>API Router Tester</h1>

    <button onclick="testAuthEndpoint()">Test Protected Route</button>

    <div id="output" style="margin-top: 20px; white-space: pre-wrap"></div>

    <script>
      const API_URL = "http://localhost:8080"; // Change to match your backend

      async function testAuthEndpoint() {
        const output = document.getElementById("output");
        output.textContent = "Testing protected endpoint...";

        try {
          const response = await fetch(`${API_URL}/profile/`, {
            method: "GET",
            headers: {
              // Include the token your AuthRouter expects, like a Bearer Token
              Authorization:
                "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJJRCI6ImU5N2EwNzUzLWY2MDktNDlkNS1hMmQyLTIxYzRlODNjZjEyOCIsIkVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsImlzcyI6InZhbmRvIiwiZXhwIjoxNzc5NzY0MjUyfQ.2i1c1_WP0OncauTK1aENt33q9WWOTpyUzD0Tl8oeVCM",
            },
          });

          if (response.ok) {
            const data = await response.json();
            output.className = "success";
            output.textContent =
              "Auth Success! Response:\n" + JSON.stringify(data, null, 2);
          } else {
            const errorText = await response.text();
            output.className = "error";
            output.textContent = `Auth Rejected (Expected if no token is provided): HTTP ${response.status}\n${errorText}`;
          }
        } catch (err) {
          output.className = "error";
          output.textContent = "Error during auth request.\n" + err;
        }
      }
    </script>
  </body>
</html>
