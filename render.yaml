version: "1"

projects:
  - name: vanwallet
    environments:
      - name: Production

        services:
          - type: web
            name: vanwallet-backend
            runtime: image
            image:
              url: ghcr.io/rivando-al-rasyid/vanwallet-backend:latest
            plan: free
            region: singapore
            autoDeployTrigger: commit
            envVars:
              - key: PORT
                value: 8080
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: vanwallet-postgres
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: vanwallet-redis
                  property: connectionString
              - key: JWT_ISSUER
                value: vanwallet
              - key: JWT_SECRET
                sync: false
              - key: ALLOWED_ORIGIN
                value: https://vanwallet-frontend.onrender.com
              - key: MIDTRANS_SERVER_KEY
                sync: false
              - key: MIDTRANS_CLIENT_KEY
                sync: false
              - key: MIDTRANS_IS_PRODUCTION
                value: "false"
              - key: MIDTRANS_FINISH_URL
                value: https://vanwallet-frontend.onrender.com/topup/finish

          - type: keyvalue
            name: vanwallet-redis
            plan: free
            region: singapore
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

        databases:
          - name: vanwallet-postgres
            databaseName: vanwallet
            user: vanwallet_user
            plan: free
            region: singapore
